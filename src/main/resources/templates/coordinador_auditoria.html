<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auditoría del Sistema · Coordinación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark navbar-institucional px-4 py-3 mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="bi bi-journal-check me-2"></i>Auditoría y Trazabilidad</span>
        <div class="d-flex gap-2">
            <a th:href="@{/coordinador/panel}" class="btn btn-light btn-sm fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Volver a Solicitudes
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Bitácora de Auditoría (RN-15)</h5>
                        <input type="text" id="filtroAuditoriaInput" class="form-control form-control-sm w-50" placeholder="Filtrar por usuario, acción o detalle...">
                    </div>
                    <div class="table-responsive">
                        <table id="tablaAuditoria" class="table table-hover table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Fecha/Hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="aud : ${auditoria}">
                                    <td class="small text-muted" th:text="${aud.fechaHora}"></td>
                                    <td class="fw-semibold" th:text="${aud.usuario != null ? aud.usuario.nombre : 'Sistema'}"></td>
                                    <td><span class="badge bg-primary-subtle text-primary" th:text="${aud.accion}"></span></td>
                                    <td class="small" th:text="${aud.detalle}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Historial de Avisos (RN-16)</h5>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Reserva</th><th>Tipo</th><th>Estado</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${avisos}">
                                    <td th:text="'#' + ${a.reserva.idReserva}"></td>
                                    <td class="small" th:text="${a.tipo}"></td>
                                    <td><span class="badge bg-success" th:text="${a.estadoEnvio}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
