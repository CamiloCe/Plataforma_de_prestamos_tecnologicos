<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Institucional · Plataforma de Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="login-wrapper d-flex align-items-center justify-content-center p-3">
<div class="card login-card p-4 p-md-5" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
        <div class="equipo-icon-box mx-auto mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-pc-display-horizontal"></i>
        </div>
        <h4 class="fw-bold mb-1">Recursos Tecnológicos</h4>
        <p class="text-muted small mb-0">Sistema Institucional de Préstamos y Reservas</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Correo Institucional</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" name="correo" class="form-control" placeholder="usuario@uni.edu" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Ingresar al Sistema <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </form>
</div>
</body>
</html>
